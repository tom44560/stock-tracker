<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的股票</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'PingFang TC','Noto Sans TC',sans-serif; min-height:100vh; background: linear-gradient(135deg,#0f172a 0%,#1e293b 60%,#0f4c75 100%); padding: 24px 16px 48px; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.82} }
.container { max-width:700px; margin:0 auto; }
.header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
.header-sub { color:#94a3b8; font-size:13px; letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
.header h1 { color:#f8fafc; font-size:28px; font-weight:800; }
.btn-add { background:#3b82f6; color:#fff; border:none; border-radius:12px; padding:10px 20px; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(59,130,246,0.4); }
.summary { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:24px; margin-bottom:24px; }
.summary-label { color:#94a3b8; font-size:13px; margin-bottom:8px; }
.summary-value { color:#f8fafc; font-size:36px; font-weight:800; letter-spacing:-1px; margin-bottom:16px; }
.summary-row { display:flex; gap:32px; }
.summary-item label { color:#64748b; font-size:12px; display:block; margin-bottom:4px; }
.summary-item span { color:#cbd5e1; font-size:16px; font-weight:600; }
.card { background:#fff; border-radius:16px; box-shadow:0 2px 16px rgba(15,23,42,0.08); padding:20px 24px; margin-bottom:16px; position:relative; overflow:hidden; }
.card-accent { position:absolute; left:0; top:0; bottom:0; width:4px; border-radius:4px 0 0 4px; }
.card-body { display:flex; justify-content:space-between; align-items:flex-start; padding-left:8px; }
.card-main { flex:1; }
.card-symbol { background:#1e293b; color:#94a3b8; border-radius:8px; padding:2px 10px; font-size:13px; font-weight:700; margin-right:8px; }
.card-name { color:#475569; font-size:14px; }
.card-stats { display:flex; gap:24px; margin-top:10px; flex-wrap:wrap; }
.stat-label { color:#9ca3af; font-size:11px; margin-bottom:2px; }
.stat-value { color:#374151; font-size:15px; font-weight:600; }
.pnl-row { margin-top:12px; display:flex; align-items:center; gap:10px; }
.pnl-badge { display:inline-flex; align-items:center; gap:3px; padding:2px 10px; border-radius:20px; font-size:13px; font-weight:700; }
.pnl-bar-bg { flex:1; height:4px; background:#f1f5f9; border-radius:4px; overflow:hidden; }
.pnl-bar { height:100%; border-radius:4px; }
.card-actions { display:flex; flex-direction:column; gap:6px; margin-left:12px; }
.btn-edit { background:#f1f5f9; border:none; border-radius:8px; padding:6px 12px; font-size:13px; color:#475569; cursor:pointer; font-weight:600; }
.btn-update { background:#eff6ff; border:none; border-radius:8px; padding:6px 12px; font-size:13px; color:#3b82f6; cursor:pointer; font-weight:600; }
.btn-delete { background:#fff0f0; border:none; border-radius:8px; padding:6px 12px; font-size:13px; color:#ef4444; cursor:pointer; font-weight:600; }
.strategy-panel { margin-top:14px; border-top:1px solid #f1f5f9; padding-top:12px; }
.badge-row { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
.badge { border-radius:20px; padding:2px 10px; font-size:11px; font-weight:800; }
.signal-banner { border-radius:12px; padding:12px 16px; display:flex; align-items:center; gap:10px; margin-bottom:8px; box-shadow:0 4px 16px rgba(0,0,0,0.2); animation:pulse 1.5s infinite; }
.signal-title { font-size:13px; font-weight:900; color:#fff; }
.signal-reason { font-size:11px; color:rgba(255,255,255,0.8); margin-top:2px; }
.strategy-box { border-radius:10px; padding:8px 12px; display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.strategy-box-title { font-size:12px; font-weight:800; }
.strategy-box-sub { font-size:11px; margin-top:2px; }
.tag-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.tag { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
.ref-toggle { background:#f1f5f9; border:1px solid #e2e8f0; border-radius:8px; padding:5px 12px; font-size:12px; font-weight:700; color:#64748b; cursor:pointer; margin-top:8px; }
.ref-fields { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
.ref-field-row { display:flex; align-items:center; gap:8px; }
.ref-field-label { font-size:12px; color:#64748b; font-weight:600; min-width:140px; }
.ref-input { padding:5px 10px; border-radius:8px; border:1.5px solid #e2e8f0; font-size:13px; width:100px; outline:none; }
.ref-toggle-btn { padding:4px 14px; border-radius:20px; border:none; cursor:pointer; font-size:12px; font-weight:700; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; }
.modal { background:#fff; border-radius:20px; padding:28px; width:100%; max-width:460px; box-shadow:0 24px 64px rgba(0,0,0,0.3); max-height:92vh; overflow-y:auto; }
.modal h2 { margin:0 0 16px; font-size:20px; font-weight:800; color:#0f172a; }
.fetch-row { display:flex; gap:8px; }
.btn-fetch { padding:0 14px; border-radius:10px; border:none; cursor:pointer; background:#0f172a; color:#fff; font-size:13px; font-weight:700; white-space:nowrap; flex-shrink:0; }
.fetch-msg { font-size:11px; margin-top:5px; }
.field-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.field-group { margin-bottom:10px; }
.field-label { display:block; font-size:12px; color:#64748b; margin-bottom:4px; font-weight:700; }
.field-input { width:100%; padding:10px 14px; border-radius:10px; border:1.5px solid #e2e8f0; font-size:14px; outline:none; color:#0f172a; }
.strategy-section { background:#f8fafc; border-radius:12px; padding:16px; border:1px solid #e2e8f0; margin-bottom:14px; }
.strategy-section-title { font-size:13px; font-weight:800; color:#1e293b; margin-bottom:12px; }
.group-label { display:inline-flex; align-items:center; gap:6px; border-radius:20px; padding:3px 12px; font-size:12px; font-weight:800; margin-bottom:8px; }
.type-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.type-btn { padding:10px 12px; border-radius:10px; cursor:pointer; text-align:left; border:2px solid #e2e8f0; background:#fff; }
.type-btn-title { font-size:13px; font-weight:800; }
.type-btn-desc { font-size:10px; color:#94a3b8; margin-top:3px; line-height:1.4; }
.tab-row { display:flex; gap:8px; margin-bottom:12px; border-top:1px solid #e2e8f0; padding-top:14px; margin-top:4px; }
.tab-btn { flex:1; padding:8px 10px; border-radius:10px; cursor:pointer; border:2px solid #e2e8f0; background:#fff; }
.tab-title { font-size:12px; font-weight:700; }
.tab-sub { font-size:10px; color:#94a3b8; margin-top:2px; }
.option-list { display:flex; flex-direction:column; gap:8px; }
.option-hint { font-size:11px; color:#94a3b8; margin-bottom:2px; }
.option-label { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:10px; cursor:pointer; border:1.5px solid #e2e8f0; background:#fff; }
.option-text { font-size:13px; font-weight:600; color:#374151; line-height:1.5; }
.error-msg { color:#ef4444; font-size:13px; margin-bottom:10px; }
.btn-row { display:flex; gap:10px; }
.btn-cancel { flex:1; padding:12px; border-radius:10px; border:1.5px solid #e2e8f0; background:#fff; font-size:15px; font-weight:600; color:#64748b; cursor:pointer; }
.btn-save { flex:1; padding:12px; border-radius:10px; border:none; background:#3b82f6; font-size:15px; font-weight:700; color:#fff; cursor:pointer; }
.empty { text-align:center; color:#475569; padding:48px 0; }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
const STORAGE_KEY = "stock_portfolio_v4";
const API = "https://stock-api-1-bi2k.onrender.com";

const GROUPS = {
  worker: {
    label:"上班族型", icon:"💼", color:"#6366f1",
    types: {
      standard: { label:"週趨勢策略", icon:"📅", desc:"以週K為主要判斷依據，節奏較慢，適合不常看盤",
        exit:[{v:"weekly_close",l:"週K收盤價低於上週五"},{v:"ma10",l:"收盤價跌破10日線"},{v:"custom_ma",l:"自訂均線出場"},{v:"any_profit",l:"有賺錢就賣"}],
        profit:[{v:"weekly_macd",l:"週MACD柱狀體開始往下（週五收盤為準）"},{v:"ma20",l:"跌破月線(20MA)"},{v:"any_profit",l:"有賺錢就賣"}]
      },
      aggressive: { label:"強勢週策略", icon:"⚡", desc:"以5日線為主，節奏快，適合看到強勢股短線操作",
        exit:[{v:"ma5_close",l:"收盤跌破5日線"},{v:"4day_stuck",l:"買進後4個交易日損益仍在±1~3%就賣出"},{v:"any_profit",l:"有賺錢就賣"}],
        profit:[{v:"ma5_or_ma10",l:"收盤跌破5日線 / 10日線"},{v:"any_profit",l:"有賺錢就賣"}]
      }
    }
  },
  boss: {
    label:"老闆型", icon:"👔", color:"#f59e0b",
    types: {
      longterm: { label:"長線控盤策略", icon:"🏦", desc:"月線/月MACD/營收為依據，節奏最慢，適合長線持有",
        exit:[{v:"long_ma",l:"守一條更長周期的均線（自行設定）"},{v:"monthly_macd",l:"當月月MACD紅柱比上月短（月底最後一天判斷）"},{v:"revenue_yoy",l:"營收年增率(YoY)轉負"}],
        profit:[{v:"ma_daily",l:"守一條均線（10日線 / 月線20MA）"},{v:"weekly_close_compare",l:"下週五收盤須高於本週五收盤價"},{v:"any_profit",l:"有賺錢就賣"}]
      }
    }
  }
};

function getGroup(g) { return GROUPS[g]; }
function getStype(g,t) { return GROUPS[g]?.types[t]; }
function getExitLabel(g,t,v) { return getStype(g,t)?.exit.find(o=>o.v===v)?.l||v; }
function getProfitLabel(g,t,v) { return getStype(g,t)?.profit.find(o=>o.v===v)?.l||v; }

function fmt(n) { return Number(n).toLocaleString("zh-TW",{minimumFractionDigits:2,maximumFractionDigits:2}); }

let stocks = [];
try { stocks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { stocks = []; }
if (!stocks.length) stocks = [{id:1,symbol:"2330",name:"台積電",shares:100,buyPrice:850,currentPrice:920,strategyGroup:"worker",strategyType:"standard",exitStrategy:"weekly_close",profitStrategy:"weekly_macd",customMA:"",refData:{}}];

let showForm = false;
let editId = null;
let form = {};
let strategyTab = "exit";
let fetchMsg = "";
let fetching = false;
let refOpen = {};

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(stocks)); }

function detectSignal(stock, pnlPct) {
  const price = parseFloat(stock.currentPrice);
  const ref = stock.refData || {};
  const isBoss = stock.strategyGroup === "boss";
  const isHighProfit = pnlPct >= 10;
  const hasProfit = pnlPct > 0;
  const checkExit = isBoss || !isHighProfit;
  const checkProfit = isBoss || isHighProfit;
  let eT=false, pT=false, eR="", pR="";

  if (checkExit) {
    const es = stock.exitStrategy;
    if (es==="any_profit"&&hasProfit){eT=true;eR="現在有獲利，可考慮出場";}
    if (es==="weekly_close"&&ref.lastWeekClose&&price<+ref.lastWeekClose){eT=true;eR=`收盤(${price})低於上週五(${ref.lastWeekClose})`;}
    if (es==="ma10"&&ref.ma10&&price<+ref.ma10){eT=true;eR=`收盤(${price})跌破10日線(${ref.ma10})`;}
    if (es==="custom_ma"&&ref.customMAVal&&price<+ref.customMAVal){eT=true;eR=`收盤(${price})跌破${stock.customMA}(${ref.customMAVal})`;}
    if (es==="ma5_close"&&ref.ma5&&price<+ref.ma5){eT=true;eR=`收盤(${price})跌破5日線(${ref.ma5})`;}
    if (es==="4day_stuck"&&ref.fourDayPnlPct!==undefined){const p=+ref.fourDayPnlPct;if(!isNaN(p)&&Math.abs(p)<=3){eT=true;eR=`買進後4日損益仍在${p}%，建議出場`;}}
    if (es==="long_ma"&&ref.longMAVal&&price<+ref.longMAVal){eT=true;eR=`收盤(${price})跌破長周期均線(${ref.longMAVal})`;}
    if (es==="monthly_macd"&&ref.macdShrink){eT=true;eR="月MACD紅柱比上月短，金流可能走了";}
    if (es==="revenue_yoy"&&ref.revenueNeg){eT=true;eR="營收年增率(YoY)已轉負";}
  }
  if (checkProfit) {
    const ps = stock.profitStrategy;
    if (ps==="any_profit"&&hasProfit){pT=true;pR="現在有獲利，可考慮停利";}
    if (ps==="ma20"&&ref.ma20&&price<+ref.ma20){pT=true;pR=`收盤(${price})跌破月線20MA(${ref.ma20})`;}
    if (ps==="ma5_or_ma10"){const m5=ref.ma5?+ref.ma5:null;const m10=ref.ma10?+ref.ma10:null;if((m5&&price<m5)||(m10&&price<m10)){pT=true;pR=`收盤(${price})跌破${m5&&price<m5?`5日線(${ref.ma5})`:`10日線(${ref.ma10})`}`;}}
    if (ps==="ma_daily"&&ref.maDailyVal&&price<+ref.maDailyVal){pT=true;pR=`收盤(${price})跌破均線(${ref.maDailyVal})`;}
    if (ps==="weekly_close_compare"&&ref.thisWeekClose&&price<+ref.thisWeekClose){pT=true;pR=`本週五收盤(${price})低於上週五(${ref.thisWeekClose})`;}
    if (ps==="weekly_macd"&&ref.weeklyMacdDown){pT=true;pR="週MACD柱狀體開始往下";}
  }
  return {eT,pT,eR,pR};
}

function getRefFields(stock) {
  const fields=[];const es=stock.exitStrategy;const ps=stock.profitStrategy;
  if(es==="weekly_close")fields.push({k:"lastWeekClose",l:"上週五收盤價"});
  if(es==="ma10")fields.push({k:"ma10",l:"10日線(MA10)"});
  if(es==="custom_ma")fields.push({k:"customMAVal",l:(stock.customMA||"自訂均線")+"數值"});
  if(es==="ma5_close")fields.push({k:"ma5",l:"5日線(MA5)"});
  if(es==="4day_stuck")fields.push({k:"fourDayPnlPct",l:"買進後第4日損益%"});
  if(es==="long_ma")fields.push({k:"longMAVal",l:"長周期均線數值"});
  if(es==="monthly_macd")fields.push({k:"macdShrink",l:"月MACD紅柱縮短了？",toggle:true});
  if(es==="revenue_yoy")fields.push({k:"revenueNeg",l:"營收YoY已轉負？",toggle:true});
  if(ps==="ma20")fields.push({k:"ma20",l:"月線(MA20)"});
  if(ps==="ma5_or_ma10"){if(!fields.find(f=>f.k==="ma5"))fields.push({k:"ma5",l:"5日線(MA5)"});if(!fields.find(f=>f.k==="ma10"))fields.push({k:"ma10",l:"10日線(MA10)"});}
  if(ps==="ma_daily")fields.push({k:"maDailyVal",l:"守護均線數值"});
  if(ps==="weekly_close_compare")fields.push({k:"thisWeekClose",l:"本週五收盤價"});
  if(ps==="weekly_macd")fields.push({k:"weeklyMacdDown",l:"週MACD柱開始往下？",toggle:true});
  const seen=new Set();return fields.filter(f=>{if(seen.has(f.k))return false;seen.add(f.k);return true;});
}

async function fetchStock() {
  const symbol = form.symbol || document.querySelector('input[placeholder="e.g. 2330"]')?.value;
  if(!symbol||symbol.length<4){alert("請先輸入股票代碼");return;}
  form.symbol = symbol;
  fetching=true;fetchMsg="查詢中...";render();
  try {
    console.log("Fetching:", `${API}/stock?symbol=${symbol}`);
    const res=await fetch(`${API}/stock?symbol=${symbol}`);
    const data=await res.json();
    console.log("Got data:", data);
    if(data.stat==="OK"&&data.data&&data.data.length>0){
      const latest=data.data[data.data.length-1];
      const closePrice=parseFloat(String(latest[6]).replace(/,/g,""));
      const titleParts=data.title.split(" ").map(s=>s.trim()).filter(Boolean);
      const nameIdx=titleParts.findIndex(p=>p===symbol);
      const stockName=nameIdx>=0&&titleParts[nameIdx+1]?titleParts[nameIdx+1]:symbol;
      form.name=stockName;
      form.currentPrice=String(closePrice);
      fetchMsg="✅ "+stockName+" 收盤價 $"+closePrice;
    } else { fetchMsg="⚠️ 查無資料，請手動輸入"; }
  } catch(e) { 
    console.error("Fetch error:", e);
    fetchMsg="❌ 查詢失敗: "+e.message; 
  }
  fetching=false;
  render();
}

async function autoUpdateFridays(stockId, symbol) {
  try {
    const res=await fetch(`${API}/fridays?symbol=${symbol}`);
    const data=await res.json();
    const s=stocks.find(s=>s.id===stockId);
    if(s&&data){
      s.refData=s.refData||{};
      if(data.thisWeekFriday)s.refData.thisWeekClose=String(data.thisWeekFriday.close);
      if(data.lastWeekFriday)s.refData.lastWeekClose=String(data.lastWeekFriday.close);
    }
    save();render();
  } catch(e) { alert("更新失敗"); }
}

function openAdd() {
  form={symbol:"",name:"",shares:"",buyPrice:"",currentPrice:"",strategyGroup:"worker",strategyType:"standard",exitStrategy:"weekly_close",profitStrategy:"weekly_macd",customMA:""};
  editId=null;strategyTab="exit";fetchMsg="";showForm=true;render();
}
function openEdit(stock) {
  form={symbol:stock.symbol,name:stock.name,shares:stock.shares,buyPrice:stock.buyPrice,currentPrice:stock.currentPrice,strategyGroup:stock.strategyGroup||"worker",strategyType:stock.strategyType||"standard",exitStrategy:stock.exitStrategy||"weekly_close",profitStrategy:stock.profitStrategy||"weekly_macd",customMA:stock.customMA||""};
  editId=stock.id;strategyTab="exit";fetchMsg="";showForm=true;render();
}
function handleSave() {
  if(!form.symbol||!form.shares||!form.buyPrice||!form.currentPrice){alert("請填寫所有欄位");return;}
  const parsed={symbol:form.symbol.trim().toUpperCase(),name:form.name||form.symbol,shares:+form.shares,buyPrice:+form.buyPrice,currentPrice:+form.currentPrice,strategyGroup:form.strategyGroup,strategyType:form.strategyType,exitStrategy:form.exitStrategy,profitStrategy:form.profitStrategy,customMA:form.customMA,refData:{}};
  if(isNaN(parsed.shares)||isNaN(parsed.buyPrice)||isNaN(parsed.currentPrice)){alert("數字格式不正確");return;}
  if(editId!==null){const i=stocks.findIndex(s=>s.id===editId);if(i>=0){parsed.refData=stocks[i].refData||{};stocks[i]={...stocks[i],...parsed};}}
  else{stocks.push({id:Date.now(),...parsed});}
  save();showForm=false;render();
}
function deleteStock(id){stocks=stocks.filter(s=>s.id!==id);save();render();}
function updateRef(id,key,value){const s=stocks.find(s=>s.id===id);if(s){s.refData=s.refData||{};s.refData[key]=value;save();render();}}
function changeStrategyType(gk,tk){
  const stype=getStype(gk,tk);
  form.strategyGroup=gk;form.strategyType=tk;
  form.exitStrategy=stype?.exit[0]?.v||"";form.profitStrategy=stype?.profit[0]?.v||"";
  form.customMA="";render();
}

function render() {
  const totalCost=stocks.reduce((s,st)=>s+st.shares*st.buyPrice,0);
  const totalValue=stocks.reduce((s,st)=>s+st.shares*st.currentPrice,0);
  const totalPnL=totalValue-totalCost;
  const totalPnLPct=totalCost>0?(totalPnL/totalCost)*100:0;

  let html = `
  <div class="header">
    <div><div class="header-sub">Portfolio</div><h1>我的股票</h1></div>
    <button class="btn-add" onclick="openAdd()">＋ 新增</button>
  </div>
  <div class="summary">
    <div class="summary-label">總市值</div>
    <div class="summary-value">$ ${fmt(totalValue)}</div>
    <div class="summary-row">
      <div class="summary-item"><label>成本</label><span>$ ${fmt(totalCost)}</span></div>
      <div class="summary-item"><label>損益</label><span style="color:${totalPnL>=0?'#34d399':'#f87171'}">${totalPnL>=0?'+':''}${fmt(totalPnL)} (${totalPnLPct>=0?'+':''}${fmt(totalPnLPct)}%)</span></div>
      <div class="summary-item"><label>持股數</label><span>${stocks.length} 檔</span></div>
    </div>
  </div>`;

  if(!stocks.length) html+=`<div class="empty">尚無股票，點擊「＋ 新增」開始追蹤</div>`;

  stocks.forEach(stock=>{
    const cost=stock.shares*stock.buyPrice;
    const value=stock.shares*stock.currentPrice;
    const pnl=value-cost;
    const pnlPct=cost>0?(pnl/cost)*100:0;
    const isPos=pnl>=0;
    const group=getGroup(stock.strategyGroup);
    const stype=getStype(stock.strategyGroup,stock.strategyType);
    const groupColor=group?.color||"#6366f1";
    const {eT,pT,eR,pR}=detectSignal(stock,pnlPct);
    const isBoss=stock.strategyGroup==="boss";
    const isHighProfit=pnlPct>=10;
    const refFields=getRefFields(stock);
    const anySignal=eT||pT;
    const isRefOpen=refOpen[stock.id];
    const exitLabel=getExitLabel(stock.strategyGroup,stock.strategyType,stock.exitStrategy);
    const profitLabel=getProfitLabel(stock.strategyGroup,stock.strategyType,stock.profitStrategy);

    let strategyHTML=`<div class="strategy-panel">`;
    // badges
    if(stype){
      strategyHTML+=`<div class="badge-row">
        <span class="badge" style="background:${groupColor}18;color:${groupColor};border:1px solid ${groupColor}40">${group.icon} ${group.label}</span>
        <span class="badge" style="background:#f1f5f9;color:#64748b">${stype.icon} ${stype.label}</span>
      </div>`;
    }
    // signal banners
    if(eT) strategyHTML+=`<div class="signal-banner" style="background:${isBoss?'linear-gradient(90deg,#7f1d1d,#991b1b)':'linear-gradient(90deg,#1e3a8a,#1d4ed8)'}">
      <span style="font-size:22px">🚨</span>
      <div><div class="signal-title">${isBoss?'停損訊號觸發！':'出場訊號觸發！'}</div><div class="signal-reason">${eR}</div></div>
    </div>`;
    if(pT) strategyHTML+=`<div class="signal-banner" style="background:linear-gradient(90deg,#78350f,#92400e)">
      <span style="font-size:22px">🎯</span>
      <div><div class="signal-title">停利訊號觸發！</div><div class="signal-reason">${pR}</div></div>
    </div>`;

    if(isBoss){
      strategyHTML+=`
        <div class="strategy-box" style="background:${eT?'linear-gradient(90deg,#fff0f0,#fee2e2)':'#f8fafc'};border:1px solid ${eT?'#fca5a5':'#e2e8f0'}">
          <span style="font-size:16px">🔴</span>
          <div><div class="strategy-box-title" style="color:${eT?'#7f1d1d':'#374151'}">停損點 SOP</div><div class="strategy-box-sub" style="color:${eT?'#991b1b':'#94a3b8'}">觀察：${exitLabel}</div></div>
        </div>
        <div class="strategy-box" style="background:${pT?'linear-gradient(90deg,#fef9c3,#fef3c7)':'#f8fafc'};border:1px solid ${pT?'#fbbf24':'#e2e8f0'}">
          <span style="font-size:16px">🎯</span>
          <div><div class="strategy-box-title" style="color:${pT?'#92400e':'#374151'}">停利點</div><div class="strategy-box-sub" style="color:${pT?'#a16207':'#94a3b8'}">觀察：${profitLabel}</div></div>
        </div>`;
    } else {
      if(isHighProfit){
        strategyHTML+=`<div class="strategy-box" style="background:${pT?'linear-gradient(90deg,#fef9c3,#fef3c7)':'#f8fafc'};border:1px solid ${pT?'#fbbf24':'#e2e8f0'};margin-bottom:8px">
          <span style="font-size:16px">🎯</span>
          <div><div class="strategy-box-title" style="color:${pT?'#92400e':'#374151'}">獲利已達 10%↑ — 停利模式</div><div class="strategy-box-sub" style="color:${pT?'#a16207':'#94a3b8'}">觀察：${profitLabel}</div></div>
        </div>`;
      } else {
        strategyHTML+=`<div class="strategy-box" style="background:${eT?'linear-gradient(90deg,#eff6ff,#dbeafe)':'#f8fafc'};border:1px solid ${eT?'#93c5fd':'#e2e8f0'};margin-bottom:8px">
          <span style="font-size:16px">🛡️</span>
          <div><div class="strategy-box-title" style="color:${eT?'#1e40af':'#374151'}">獲利未達 10% — 出場點監控中</div><div class="strategy-box-sub" style="color:${eT?'#1d4ed8':'#94a3b8'}">觀察：${exitLabel}</div></div>
        </div>`;
      }
      strategyHTML+=`<div class="tag-row">
        <span class="tag" style="background:${!isHighProfit?'#dbeafe':'#f1f5f9'};color:${!isHighProfit?'#1d4ed8':'#94a3b8'};border:1px solid ${!isHighProfit?'#93c5fd':'#e2e8f0'}">🛡️ 出場：${exitLabel}</span>
        <span class="tag" style="background:${isHighProfit?'#fef3c7':'#f1f5f9'};color:${isHighProfit?'#92400e':'#94a3b8'};border:1px solid ${isHighProfit?'#fbbf24':'#e2e8f0'}">🎯 停利：${profitLabel}</span>
      </div>`;
    }

    // ref fields
    if(refFields.length>0){
      strategyHTML+=`<button class="ref-toggle" style="background:${anySignal?'#fef3c7':'#f1f5f9'};border-color:${anySignal?'#fbbf24':'#e2e8f0'};color:${anySignal?'#92400e':'#64748b'}" onclick="refOpen['${stock.id}']=!refOpen['${stock.id}'];render()">
        ${isRefOpen?'▲ 收起':'▼ 輸入參考數值'}${anySignal?' ⚡':''}
      </button>`;
      if(isRefOpen){
        strategyHTML+=`<div class="ref-fields">`;
        refFields.forEach(field=>{
          const val=stock.refData?.[field.k];
          if(field.toggle){
            strategyHTML+=`<div class="ref-field-row">
              <label class="ref-field-label">${field.l}</label>
              <button class="ref-toggle-btn" style="background:${val?'#fee2e2':'#f1f5f9'};color:${val?'#dc2626':'#64748b'}" onclick="updateRef(${stock.id},'${field.k}',${!val})">${val?'是 ✓':'否'}</button>
            </div>`;
          } else {
            strategyHTML+=`<div class="ref-field-row">
              <label class="ref-field-label">${field.l}</label>
              <input class="ref-input" type="number" value="${val||''}" placeholder="輸入數值" onchange="updateRef(${stock.id},'${field.k}',this.value)">
            </div>`;
          }
        });
        strategyHTML+=`</div>`;
      }
    }
    strategyHTML+=`</div>`;

    html+=`<div class="card">
      <div class="card-accent" style="background:${isPos?'#10b981':'#ef4444'}"></div>
      <div class="card-body">
        <div class="card-main">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span class="card-symbol">${stock.symbol}</span>
            <span class="card-name">${stock.name}</span>
          </div>
          <div class="card-stats">
            <div><div class="stat-label">持股</div><div class="stat-value">${stock.shares.toLocaleString()}</div></div>
            <div><div class="stat-label">買入價</div><div class="stat-value">${fmt(stock.buyPrice)}</div></div>
            <div><div class="stat-label">現價</div><div class="stat-value">${fmt(stock.currentPrice)}</div></div>
            <div><div class="stat-label">市值</div><div class="stat-value">${fmt(value)}</div></div>
          </div>
          <div class="pnl-row">
            <span class="pnl-badge" style="background:${isPos?'#d1fae5':'#fee2e2'};color:${isPos?'#065f46':'#991b1b'}">${isPos?'▲':'▼'} ${fmt(Math.abs(pnl))}</span>
            <span style="color:${isPos?'#059669':'#dc2626'};font-size:13px;font-weight:600">${pnlPct>=0?'+':''}${fmt(pnlPct)}%</span>
            <div class="pnl-bar-bg"><div class="pnl-bar" style="width:${Math.min(Math.abs(pnlPct)*4,100)}%;background:${isPos?'#10b981':'#ef4444'}"></div></div>
          </div>
          ${strategyHTML}
        </div>
        <div class="card-actions">
          <button class="btn-edit" onclick="openEdit(stocks.find(s=>s.id===${stock.id}))">編輯</button>
          <button class="btn-update" onclick="autoUpdateFridays(${stock.id},'${stock.symbol}')">📅 更新</button>
          <button class="btn-delete" onclick="deleteStock(${stock.id})">刪除</button>
        </div>
      </div>
    </div>`;
  });

  // Modal
  if(showForm){
    const currentStype=getStype(form.strategyGroup,form.strategyType);
    let modalHTML=`<div class="modal-overlay" onclick="if(event.target===this){showForm=false;render()}">
    <div class="modal">
      <h2>${editId!==null?'編輯股票':'新增股票'}</h2>
      <div class="field-group">
        <label class="field-label">股票代碼</label>
        <div class="fetch-row">
          <input class="field-input" style="flex:1" value="${form.symbol||''}" oninput="form.symbol=this.value;fetchMsg=''" placeholder="e.g. 2330">
          <button class="btn-fetch" onclick="fetchStock()" ${fetching?'disabled':''} style="${fetching?'background:#e2e8f0;color:#94a3b8':''}">${fetching?'查詢中...':'🔍 查詢'}</button>
        </div>
        ${fetchMsg?`<div class="fetch-msg" style="color:${fetchMsg.startsWith('✅')?'#059669':fetchMsg.startsWith('⚠️')?'#d97706':'#dc2626'}">${fetchMsg}</div>`:''}
      </div>
      <div class="field-grid">
        <div><label class="field-label">股票名稱</label><input class="field-input" id="input-name" value="${form.name||''}" oninput="form.name=this.value" placeholder="e.g. 台積電"></div>
        <div><label class="field-label">持股數量</label><input class="field-input" type="number" value="${form.shares||''}" oninput="form.shares=this.value" placeholder="e.g. 100"></div>
        <div><label class="field-label">買入價格</label><input class="field-input" type="number" value="${form.buyPrice||''}" oninput="form.buyPrice=this.value" placeholder="e.g. 850"></div>
        <div><label class="field-label">現在價格</label><input class="field-input" id="input-price" type="number" value="${form.currentPrice||''}" oninput="form.currentPrice=this.value" placeholder="e.g. 920"></div>
      </div>
      <div class="strategy-section">
        <div class="strategy-section-title">📋 操作策略設定</div>`;

    Object.entries(GROUPS).forEach(([gk,group])=>{
      modalHTML+=`<div style="margin-bottom:12px">
        <div class="group-label" style="background:${group.color}18;color:${group.color};border:1px solid ${group.color}40">${group.icon} ${group.label}</div>
        <div class="type-grid">`;
      Object.entries(group.types).forEach(([tk,stype])=>{
        const sel=form.strategyGroup===gk&&form.strategyType===tk;
        modalHTML+=`<button class="type-btn" style="border-color:${sel?group.color:'#e2e8f0'};background:${sel?group.color+'12':'#fff'}" onclick="changeStrategyType('${gk}','${tk}')">
          <div class="type-btn-title" style="color:${sel?group.color:'#374151'}">${stype.icon} ${stype.label}</div>
          <div class="type-btn-desc">${stype.desc}</div>
        </button>`;
      });
      modalHTML+=`</div></div>`;
    });

    const isBossForm=form.strategyGroup==="boss";
    modalHTML+=`<div class="tab-row">
      <button class="tab-btn" style="border-color:${strategyTab==='exit'?(isBossForm?'#ef4444':'#3b82f6'):'#e2e8f0'};background:${strategyTab==='exit'?(isBossForm?'#fff0f0':'#eff6ff'):'#fff'}" onclick="strategyTab='exit';render()">
        <div class="tab-title" style="color:${strategyTab==='exit'?(isBossForm?'#991b1b':'#1d4ed8'):'#64748b'}">${isBossForm?'🔴 停損點':'🛡️ 出場點'}</div>
        <div class="tab-sub">${isBossForm?'長線停損 SOP':'獲利 < 10% 或負值'}</div>
      </button>
      <button class="tab-btn" style="border-color:${strategyTab==='profit'?'#f59e0b':'#e2e8f0'};background:${strategyTab==='profit'?'#fffbeb':'#fff'}" onclick="strategyTab='profit';render()">
        <div class="tab-title" style="color:${strategyTab==='profit'?'#92400e':'#64748b'}">🎯 停利點</div>
        <div class="tab-sub">${isBossForm?'日線級別判斷':'獲利 >= 10%'}</div>
      </button>
    </div>`;

    if(strategyTab==='exit'&&currentStype){
      modalHTML+=`<div class="option-list"><div class="option-hint">${isBossForm?'擇一選擇停損條件：':'擇一選擇出場條件：'}</div>`;
      currentStype.exit.forEach(opt=>{
        const sel=form.exitStrategy===opt.v;
        modalHTML+=`<label class="option-label" style="border-color:${sel?'#3b82f6':'#e2e8f0'};background:${sel?'#eff6ff':'#fff'}" onclick="form.exitStrategy='${opt.v}';render()">
          <input type="radio" name="exit" ${sel?'checked':''} style="accent-color:#3b82f6;margin-top:2px">
          <span class="option-text" style="color:${sel?'#1d4ed8':'#374151'}">${opt.l}</span>
        </label>`;
      });
      if(form.exitStrategy==="custom_ma"){
        modalHTML+=`<div><label class="field-label">自訂均線（例：MA20、MA60）</label><input class="field-input" value="${form.customMA||''}" oninput="form.customMA=this.value" placeholder="e.g. MA20"></div>`;
      }
      modalHTML+=`</div>`;
    }
    if(strategyTab==='profit'&&currentStype){
      modalHTML+=`<div class="option-list"><div class="option-hint">擇一選擇停利條件：</div>`;
      currentStype.profit.forEach(opt=>{
        const sel=form.profitStrategy===opt.v;
        modalHTML+=`<label class="option-label" style="border-color:${sel?'#f59e0b':'#e2e8f0'};background:${sel?'#fffbeb':'#fff'}" onclick="form.profitStrategy='${opt.v}';render()">
          <input type="radio" name="profit" ${sel?'checked':''} style="accent-color:#f59e0b;margin-top:2px">
          <span class="option-text" style="color:${sel?'#92400e':'#374151'}">${opt.l}</span>
        </label>`;
      });
      modalHTML+=`</div>`;
    }

    modalHTML+=`</div>
      <div class="btn-row">
        <button class="btn-cancel" onclick="showForm=false;render()">取消</button>
        <button class="btn-save" onclick="handleSave()">儲存</button>
      </div>
    </div></div>`;
    html+=modalHTML;
  }

  document.getElementById('app').innerHTML=html;
}

render();
</script>
</body>
</html>
